<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Product</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* HEADER */
.header{
    width:calc(100% - 36px);
    margin:18px auto;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-radius:28px;
    background:
      radial-gradient(circle at 20% 0%, rgba(223,255,69,.14), transparent 30%),
      linear-gradient(180deg,#081300,#020302 85%);
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    flex-wrap:wrap;
}

.logo{
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
}

/* 3 LINE MENU */
.menu-toggle{
    display:none;
    width:44px;
    height:40px;
    border:none;
    border-radius:12px;
    background:rgba(223,255,69,.13);
    cursor:pointer;
    padding:8px;
    margin:0;
}

.menu-toggle span{
    display:block;
    width:100%;
    height:3px;
    background:#dfff45;
    border-radius:10px;
    margin:5px 0;
}

/* NAV */
.nav-links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    transition:.3s;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(223,255,69,.16);
    white-space:nowrap;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px;
}

/* CARD */
.container{
    width:100%;
    max-width:600px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

h2{
    text-align:center;
    margin-bottom:18px;
    color:#fff;
    font-size:26px;
    font-weight:800;
}

.flash{
    background:rgba(223,255,69,.12);
    color:#dfff45;
    border:1px solid rgba(223,255,69,.25);
    padding:10px;
    border-radius:12px;
    text-align:center;
    margin-bottom:12px;
    font-size:13px;
    word-wrap:break-word;
}

label{
    display:block;
    font-weight:600;
    font-size:13px;
    color:#e7e7e7;
    margin-top:12px;
}

input, textarea{
    width:100%;
    padding:12px 14px;
    margin-top:7px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    outline:none;
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
}

textarea{
    resize:vertical;
    min-height:90px;
}

input:focus,
textarea:focus{
    border-color:rgba(223,255,69,.6);
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

input[type="file"]{
    height:auto;
    font-size:13px;
}

/* IMAGE */
.preview-img{
    display:block;
    margin:10px auto 15px auto;
    width:130px;
    height:130px;
    max-width:100%;
    border-radius:16px;
    border:3px solid #dfff45;
    object-fit:cover;
}

/* BUTTON */
button[type="submit"]{
    width:100%;
    padding:15px;
    margin-top:12px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    border:none;
    border-radius:25px;
    font-weight:800;
    cursor:pointer;
    font-size:15px;
}

/* BACK LINK */
.back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    text-decoration:none;
    color:#fff;
    font-size:13px;
    font-weight:800;
}

.back-link:hover{
    color:#dfff45;
}

/* MOBILE */
@media(max-width:600px){
    .header{
        width:calc(100% - 24px);
        margin:12px auto;
        padding:14px 16px;
        border-radius:22px;
    }

    .logo{
        font-size:20px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        grid-template-columns:1fr;
        gap:8px;
        padding-top:12px;
    }

    .nav-links.active{
        display:grid;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        font-size:13px;
        padding:10px;
    }

    .main{
        align-items:flex-start;
        padding:12px;
    }

    .container{
        padding:25px 16px;
        border-radius:26px;
    }

    h2{
        font-size:22px;
    }

    input, textarea, button{
        font-size:13px;
    }

    .preview-img{
        width:110px;
        height:110px;
    }
}

@media(max-width:360px){
    .container{
        padding:22px 13px;
    }

    h2{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">SmartCart Admin</div>

    <button class="menu-toggle" onclick="toggleMenu()" type="button">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="navLinks">
        <a href="/admin-dashboard">Dashboard</a>
        <a href="/admin/item-list">Products</a>
        <a href="/admin-logout">Logout</a>
    </div>
</div>

<div class="main">
<div class="container">

<h2>Update Product</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="flash">{{ message }}</p>
  {% endfor %}
{% endwith %}

<form method="POST" action="/admin/update-item/{{ product.product_id }}" enctype="multipart/form-data">

    <label>Product Name</label>
    <input type="text" name="name" value="{{ product.name }}" required>

    <label>Description</label>
    <textarea name="description" required>{{ product.description }}</textarea>

    <label>Category</label>
    <input type="text" name="category" value="{{ product.category }}" required>

    <label>Price</label>
    <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

    <label>Current Image</label>
    <img src="/static/uploads/product_images/{{ product.image }}" class="preview-img" alt="{{ product.name }}">

    <label>Upload New Image (Optional)</label>
    <input type="file" name="image" accept="image/*">

    <button type="submit">Update Product</button>

</form>

<a href="/admin/item-list" class="back-link">← Back to Product List</a>

</div>
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
