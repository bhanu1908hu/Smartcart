<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* HEADER */
.header{
    background:#050805;
    padding:16px;
    text-align:left;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
    font-size:24px;
    font-weight:800;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD */
.container{
    width:100%;
    max-width:380px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:18px;
    color:#fff;
    font-size:24px;
    font-weight:800;
}

/* FLASH */
.flash{
    background:rgba(223,255,69,.12);
    color:#dfff45;
    border:1px solid rgba(223,255,69,.25);
    padding:10px;
    border-radius:12px;
    text-align:center;
    margin-bottom:12px;
    font-size:13px;
}

/* LABEL */
label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-top:14px;
    color:#e7e7e7;
}

/* INPUT */
input{
    width:100%;
    height:48px;
    padding:0 14px;
    margin-top:7px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    outline:none;
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
    box-shadow:inset 0 0 15px rgba(255,255,255,.04);
}

input::placeholder{
    color:#6f6f6f;
}

input:focus{
    border-color:rgba(223,255,69,.6);
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    margin-top:22px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    border:none;
    border-radius:25px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(211,255,65,.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(211,255,65,.65);
}

/* FOOTER */
.footer{
    background:#050805;
    color:#aaa;
    text-align:center;
    padding:14px;
    font-size:13px;
}

/* MOBILE */
@media(max-width:480px){
    .container{
        padding:25px 20px;
        border-radius:28px;
    }

    h2{
        font-size:21px;
    }

    input{
        height:45px;
        font-size:13px;
    }

    button{
        padding:13px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">SmartCart</div>
</div>

<div class="main">

<div class="container">

<h2>Verify OTP</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="flash">{{ message }}</p>
  {% endfor %}
{% endwith %}

<form method="POST" action="/verify-otp">

    <label>Enter OTP</label>
    <input type="text" name="otp" placeholder="Enter OTP" required>

    <label>Create Password</label>
    <input type="password" name="password" placeholder="Create password" required>

    <button type="submit">Verify & Register</button>
</form>

</div>

</div>

<div class="footer">
    © 2025 SmartCart. All rights reserved.
</div>

</body>
</html>
