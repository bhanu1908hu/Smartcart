<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Profile - SmartCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* NAVBAR */
.header{
    width:calc(100% - 36px);
    margin:18px auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    background:
      radial-gradient(circle at 20% 0%, rgba(223,255,69,.14), transparent 30%),
      linear-gradient(180deg,#081300,#020302 85%);
    border-radius:28px;
    gap:12px;
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    flex-wrap:wrap;
}

.logo{
    font-size:24px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#dfff45;
}

/* 3 LINE MENU */
.menu-toggle{
    display:none;
    width:44px;
    height:40px;
    border:none;
    border-radius:12px;
    background:rgba(223,255,69,.13);
    cursor:pointer;
    padding:8px;
    margin:0;
    box-shadow:none;
}

.menu-toggle span{
    display:block;
    width:100%;
    height:3px;
    background:#dfff45;
    border-radius:10px;
    margin:5px 0;
}

.nav-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav-links a{
    text-decoration:none;
    padding:9px 14px;
    border-radius:20px;
    color:#ccc;
    font-weight:700;
    font-size:14px;
    transition:.3s;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(223,255,69,.16);
    white-space:nowrap;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

.logout{
    background:#ff4d4d !important;
    color:#fff !important;
    border:none !important;
}

.logout:hover{
    background:#ff0000 !important;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px;
}

/* CARD */
.container{
    width:100%;
    max-width:420px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at 50% 0%, rgba(223,255,69,.16), transparent 26%),
      radial-gradient(circle at 15% 12%, rgba(223,255,69,.08), transparent 28%),
      linear-gradient(180deg,#081300,#020302 78%);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    text-align:center;
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

h2{
    margin-bottom:18px;
    color:#fff;
    font-size:25px;
    font-weight:800;
}

.profile-wrapper{
    margin-bottom:18px;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #dfff45;
    box-shadow:0 0 22px rgba(223,255,69,.45);
}

.no-img{
    color:#aaa;
    font-size:14px;
}

.form-group{
    text-align:left;
    margin-top:14px;
}

label{
    color:#e7e7e7;
    font-weight:600;
    font-size:13px;
}

input{
    width:100%;
    height:48px;
    padding:0 14px;
    margin-top:7px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    outline:none;
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
}

input[type="file"]{
    padding:12px;
    height:auto;
    font-size:13px;
}

input:focus{
    border-color:rgba(223,255,69,.6);
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

button[type="submit"]{
    width:100%;
    padding:15px;
    margin-top:24px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    border:none;
    border-radius:25px;
    color:#111;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.3s;
}

button[type="submit"]:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(211,255,65,.65);
}

.back{
    display:block;
    margin-top:18px;
    color:#fff;
    text-decoration:none;
    font-weight:800;
    font-size:13px;
}

.back:hover{
    color:#dfff45;
}

/* FOOTER */
.footer{
    width:calc(100% - 36px);
    margin:18px auto;
    padding:14px;
    border-radius:24px;
    text-align:center;
    color:#dfff45;
    background:linear-gradient(180deg,#081300,#020302);
    font-size:13px;
    font-weight:700;
}

/* MOBILE */
@media(max-width:600px){
    .header{
        width:calc(100% - 24px);
        margin:12px auto;
        padding:14px 16px;
        border-radius:22px;
    }

    .logo{
        font-size:20px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        grid-template-columns:1fr;
        gap:8px;
        padding-top:12px;
    }

    .nav-links.active{
        display:grid;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        font-size:13px;
        padding:11px;
    }

    .main{
        align-items:flex-start;
        padding:12px;
    }

    .container{
        padding:25px 16px;
        border-radius:26px;
    }

    h2{
        font-size:22px;
    }

    .profile-img{
        width:100px;
        height:100px;
    }

    input{
        height:45px;
        font-size:13px;
    }

    .footer{
        width:calc(100% - 24px);
        margin:12px auto;
        font-size:12px;
    }
}

@media(max-width:360px){
    .container{
        padding:22px 13px;
    }

    h2{
        font-size:20px;
    }

    input{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Smart<span>Cart</span> Admin</div>

    <button class="menu-toggle" onclick="toggleMenu()" type="button">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="navLinks">
        <a href="/admin-dashboard">Dashboard</a>
        <a href="/admin/item-list">Products</a>
        <a href="/admin-logout" class="logout">Logout</a>
    </div>
</div>

<div class="main">
    <div class="container">

        <h2>👤 Admin Profile</h2>

        <div class="profile-wrapper">
        {% if admin.profile_image %}
            <img src="/static/uploads/admin_profiles/{{ admin.profile_image }}" class="profile-img">
        {% else %}
            <p class="no-img">No Profile Image</p>
        {% endif %}
        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ admin.name }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ admin.email }}">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password">
            </div>

            <div class="form-group">
                <label>Profile Image</label>
                <input type="file" name="profile_image" accept="image/*">
            </div>

            <button type="submit">Update Profile</button>
        </form>

        <a href="/admin-dashboard" class="back">← Back</a>

    </div>
</div>

<div class="footer">
    © 2026 SmartCart Admin Panel
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
