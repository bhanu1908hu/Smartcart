<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* HEADER */
.header{
    width:calc(100% - 36px);
    margin:18px auto;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-radius:28px;
    background:
      radial-gradient(circle at 20% 0%, rgba(223,255,69,.14), transparent 30%),
      linear-gradient(180deg,#081300,#020302 85%);
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    flex-wrap:wrap;
}

.logo{
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
}

/* 3 LINE MENU */
.menu-toggle{
    display:none;
    width:44px;
    height:40px;
    border:none;
    border-radius:12px;
    background:rgba(223,255,69,.13);
    cursor:pointer;
    padding:8px;
    margin:0;
}

.menu-toggle span{
    display:block;
    width:100%;
    height:3px;
    background:#dfff45;
    border-radius:10px;
    margin:5px 0;
}

/* NAV */
.nav-links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(223,255,69,.16);
    white-space:nowrap;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px;
}

/* CARD */
.container{
    width:100%;
    max-width:850px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-size:26px;
    font-weight:800;
}

/* LAYOUT */
.product-wrapper{
    display:flex;
    gap:28px;
    align-items:center;
}

.product-image-box{
    flex:0 0 300px;
    display:flex;
    justify-content:center;
}

.product-img{
    width:100%;
    max-width:300px;
    max-height:320px;
    border-radius:20px;
    object-fit:contain;
    border:3px solid #dfff45;
    background:rgba(0,0,0,.35);
    padding:10px;
}

.details{
    flex:1;
    min-width:0;
}

.details p{
    margin:12px 0;
    font-size:15px;
    color:#ddd;
    line-height:1.6;
    word-break:break-word;
}

.details strong{
    color:#dfff45;
}

.price{
    font-size:28px !important;
    font-weight:800;
    color:#dfff45 !important;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 18px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    text-decoration:none;
    border-radius:25px;
    font-size:14px;
    font-weight:800;
}

/* FOOTER */
.footer{
    width:calc(100% - 36px);
    margin:18px auto;
    padding:14px;
    border-radius:24px;
    text-align:center;
    color:#dfff45;
    background:linear-gradient(180deg,#081300,#020302);
    font-size:13px;
    font-weight:700;
}

/* MOBILE */
@media(max-width:600px){
    .header{
        width:calc(100% - 24px);
        margin:12px auto;
        padding:14px 16px;
        border-radius:22px;
    }

    .logo{
        font-size:20px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        grid-template-columns:1fr;
        gap:8px;
        padding-top:12px;
    }

    .nav-links.active{
        display:grid;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        font-size:13px;
        padding:10px;
    }

    .main{
        align-items:flex-start;
        padding:12px;
    }

    .container{
        padding:25px 16px;
        border-radius:26px;
    }

    h2{
        font-size:21px;
    }

    .product-wrapper{
        flex-direction:column;
        text-align:center;
        gap:18px;
    }

    .product-image-box{
        flex:unset;
        width:100%;
    }

    .product-img{
        max-width:210px;
        max-height:230px;
    }

    .details{
        width:100%;
    }

    .details p{
        font-size:14px;
    }

    .price{
        font-size:24px !important;
    }

    .btn{
        width:100%;
        text-align:center;
    }

    .footer{
        width:calc(100% - 24px);
        margin:12px auto;
        font-size:12px;
    }
}

@media(max-width:360px){
    .container{
        padding:22px 13px;
    }

    .product-img{
        max-width:190px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">SmartCart Admin</div>

    <button class="menu-toggle" onclick="toggleMenu()" type="button">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="navLinks">
        <a href="/admin-dashboard">Dashboard</a>
        <a href="/admin/item-list">Products</a>
        <a href="/admin-logout">Logout</a>
    </div>
</div>

<div class="main">
<div class="container">

<h2>Product Details</h2>

<div class="product-wrapper">
    <div class="product-image-box">
        <img src="/static/uploads/product_images/{{ product.image }}" class="product-img" alt="{{ product.name }}">
    </div>

    <div class="details">
        <p><strong>Name:</strong> {{ product.name }}</p>
        <p><strong>Description:</strong> {{ product.description }}</p>
        <p><strong>Category:</strong> {{ product.category }}</p>
        <p class="price">₹{{ product.price }}</p>
        <a href="/admin/item-list" class="btn">Back to Products</a>
    </div>
</div>

</div>
</div>

<div class="footer">
    © 2025 SmartCart Admin Panel
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
