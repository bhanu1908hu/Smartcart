<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* CARD */
.container{
    width:100%;
    max-width:380px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at 50% 0%, rgba(223,255,69,.16), transparent 26%),
      radial-gradient(circle at 15% 12%, rgba(223,255,69,.08), transparent 28%),
      linear-gradient(180deg,#081300,#020302 78%);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:24px;
    color:#fff;
    font-size:25px;
    font-weight:800;
}

/* LABEL */
label{
    display:block;
    color:#e7e7e7;
    font-weight:600;
    font-size:13px;
    margin-bottom:6px;
}

/* INPUT */
input{
    width:100%;
    height:48px;
    padding:0 14px;
    margin-bottom:16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    outline:none;
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
    box-shadow:inset 0 0 15px rgba(255,255,255,.04);
}

input::placeholder{
    color:#6f6f6f;
}

input:focus{
    border-color:rgba(223,255,69,.6);
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    margin-top:8px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    border:none;
    border-radius:25px;
    color:#111;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(211,255,65,.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(211,255,65,.65);
}

/* FLASH */
.flash-message{
    background:rgba(223,255,69,.12);
    color:#dfff45;
    border:1px solid rgba(223,255,69,.25);
    padding:10px;
    border-radius:12px;
    text-align:center;
    margin-bottom:12px;
    font-size:13px;
}

/* LINKS */
.links{
    text-align:center;
    margin-top:18px;
    color:#aaa;
    font-size:13px;
}

.links a{
    text-decoration:none;
    color:#fff;
    font-size:13px;
    font-weight:800;
}

.links a:hover{
    color:#dfff45;
}

/* RESPONSIVE */
@media(max-width:480px){
    .container{
        padding:25px 20px;
        border-radius:28px;
    }

    h2{
        font-size:22px;
    }

    input{
        height:45px;
        font-size:13px;
    }

    button{
        padding:13px;
        font-size:14px;
    }
}
</style>

</head>
<body>

<div class="container">

<h2>🔐 Admin Login</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="flash-message">{{ message }}</p>
  {% endfor %}
{% endwith %}

<form method="POST" action="/admin-login">

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <button type="submit">Login</button>

</form>

<div class="links">
    <a href="/admin/forgot-password">Forgot Password?</a> |
    <a href="/admin-signup">Register</a>
</div>

</div>

</body>
</html>
