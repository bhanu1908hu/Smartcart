<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI', Arial, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* HEADER */
.header{
    width:100%;
    background:#050805;
    padding:16px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

.logo{
    color:#dfff45;
    font-size:24px;
    font-weight:900;
}

.menu-toggle{
    display:none;
    color:#dfff45;
    font-size:30px;
    cursor:pointer;
}

.nav-links{
    display:flex;
    gap:10px;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:9px 15px;
    border-radius:20px;
    font-size:14px;
    font-weight:800;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

/* CARD */
.container{
    width:100%;
    max-width:430px;
    padding:34px 28px;
    border-radius:32px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.container > *{
    position:relative;
    z-index:2;
}

h2{
    text-align:center;
    margin-bottom:22px;
    color:#dfff45;
    font-size:26px;
    font-weight:900;
}

label{
    font-weight:800;
    display:block;
    margin-top:14px;
    font-size:14px;
    color:#dfff45;
}

input{
    width:100%;
    height:48px;
    padding:0 14px;
    margin-top:7px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.18);
    outline:none;
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    border-color:#dfff45;
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

button{
    width:100%;
    padding:15px;
    margin-top:24px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    border:none;
    color:#111;
    font-size:15px;
    border-radius:25px;
    cursor:pointer;
    font-weight:900;
}

.flash-message{
    text-align:center;
    margin-bottom:12px;
    padding:11px;
    border-radius:12px;
    background:rgba(223,255,69,.12);
    color:#dfff45;
    font-size:13px;
    border:1px solid rgba(223,255,69,.25);
}

.login-link{
    text-align:center;
    display:block;
    margin-top:18px;
    text-decoration:none;
    color:#fff;
    font-size:14px;
    font-weight:700;
}

.login-link:hover{
    color:#dfff45;
}

.footer{
    background:#050805;
    color:#aaa;
    text-align:center;
    padding:14px;
    font-size:13px;
}

/* MOBILE MENU */
@media(max-width:768px){
    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        flex-direction:column;
        background:rgba(255,255,255,.08);
        padding:12px;
        border-radius:18px;
        margin-top:10px;
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        background:rgba(255,255,255,.06);
    }
}

@media(max-width:480px){
    .main{
        align-items:flex-start;
        padding:20px 12px;
    }

    .container{
        padding:26px 18px;
        border-radius:26px;
    }

    .logo{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="navbar">
        <div class="logo">SmartCart</div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>

        <div class="nav-links" id="navLinks">
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/user-login">Login</a>
        </div>
    </div>
</div>

<div class="main">
    <div class="container">

        <h2>Create Account</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <p class="flash-message">{{ message }}</p>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="/user-register">

            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Register</button>
        </form>

        <a href="/user-login" class="login-link">Already have an account? Login</a>

    </div>
</div>

<div class="footer">
    © 2026 SmartCart. All rights reserved.
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("show");
}
</script>

</body>
</html>
