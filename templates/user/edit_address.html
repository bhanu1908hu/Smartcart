<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Address</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

.address-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.address-card{
    width:100%;
    max-width:420px;
    padding:35px 30px;
    border-radius:32px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.address-card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.address-card > *{
    position:relative;
    z-index:2;
}

.address-card h3{
    text-align:center;
    margin-bottom:18px;
    color:#fff;
    font-size:24px;
    font-weight:800;
}

.address-card input,
.address-card textarea{
    width:100%;
    padding:12px 14px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    font-size:14px;
    background:rgba(0,0,0,.45);
    color:#fff;
    outline:none;
    box-shadow:inset 0 0 15px rgba(255,255,255,.04);
}

.address-card input::placeholder,
.address-card textarea::placeholder{
    color:#6f6f6f;
}

.address-card textarea{
    resize:none;
    height:90px;
}

.address-card input:focus,
.address-card textarea:focus{
    border-color:rgba(223,255,69,.6);
    box-shadow:0 0 14px rgba(223,255,69,.25);
}

.actions{
    margin-top:22px;
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    text-align:center;
    padding:13px;
    border-radius:25px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:800;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(211,255,65,.65);
}

.btn-secondary{
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
}

.btn-secondary:hover{
    background:#dfff45;
    color:#111;
}

@media(max-width:480px){
    .address-card{
        padding:25px 20px;
        border-radius:28px;
    }

    .address-card h3{
        font-size:21px;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>

</head>
<body>

<div class="address-wrapper">

    <div class="address-card">

        <h3>Update Delivery Address</h3>

        <form method="POST" action="/edit-address">

            <input type="text" name="full_name" placeholder="Full Name" required>

            <input type="text" name="phone" placeholder="Phone Number" required>

            <textarea name="address" placeholder="Full Address" required></textarea>

            <input type="text" name="city" placeholder="City" required>

            <input type="text" name="state" placeholder="State" required>

            <input type="text" name="pincode" placeholder="Pincode" required>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="/add-address" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
