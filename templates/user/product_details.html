<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - SmartCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* NAVBAR */
.navbar{
    width:100%;
    background:#050805;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#dfff45;
}

/* 3 LINE MENU */
.menu-toggle{
    display:none;
    color:#dfff45;
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.nav-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:9px 15px;
    border-radius:20px;
    font-size:14px;
    font-weight:700;
    transition:.3s ease;
}

.nav-links a:hover,
.nav-links a.active{
    background:#dfff45;
    color:#111;
}

/* WRAPPER */
.product-wrapper{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px 16px;
}

/* CARD */
.product-card{
    width:100%;
    max-width:950px;
    padding:32px;
    border-radius:30px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.product-card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.product-card > *{
    position:relative;
    z-index:2;
}

/* FLEX */
.product-layout{
    display:flex;
    gap:32px;
    align-items:center;
}

/* IMAGE */
.product-image{
    flex:1;
    text-align:center;
}

.product-image img{
    width:100%;
    max-width:320px;
    max-height:330px;
    object-fit:contain;
    border-radius:22px;
    padding:14px;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(223,255,69,.35);
    box-shadow:0 0 22px rgba(223,255,69,.25);
}

/* DETAILS */
.product-details{
    flex:1;
    min-width:0;
}

.product-details h2{
    margin-bottom:14px;
    color:#dfff45;
    font-size:clamp(24px,5vw,30px);
    font-weight:900;
    word-break:break-word;
}

.product-details p{
    margin:10px 0;
    color:#ddd;
    font-size:15px;
    line-height:1.7;
    word-break:break-word;
}

.product-details strong{
    color:#fff;
}

/* PRICE */
.price{
    font-size:clamp(24px,6vw,30px) !important;
    font-weight:900;
    color:#dfff45 !important;
    margin-top:16px !important;
}

/* BUTTONS */
.buttons{
    margin-top:24px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.buttons form{
    flex:1;
}

.btn{
    width:100%;
    padding:13px 18px;
    border:none;
    border-radius:25px;
    font-size:14px;
    cursor:pointer;
    text-decoration:none;
    font-weight:900;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    transition:.3s ease;
}

.back-btn{
    flex:1;
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
}

.back-btn:hover{
    background:#dfff45;
    color:#111;
}

.cart-btn{
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
}

.cart-btn:hover{
    box-shadow:0 0 20px rgba(211,255,65,.5);
}

/* FOOTER */
.footer{
    background:#050805;
    color:#aaa;
    text-align:center;
    padding:14px 10px;
    font-size:13px;
}

/* TABLET */
@media(max-width:900px){
    .product-layout{
        gap:24px;
    }

    .product-card{
        padding:26px;
    }
}

/* MOBILE MENU */
@media(max-width:768px){
    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        flex-direction:column;
        background:rgba(255,255,255,.08);
        padding:12px;
        border-radius:18px;
        margin-top:8px;
        border:1px solid rgba(223,255,69,.15);
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        background:rgba(255,255,255,.06);
    }

    .product-wrapper{
        align-items:flex-start;
        padding:20px 12px;
    }

    .product-layout{
        flex-direction:column;
        text-align:center;
    }

    .product-card{
        padding:24px 18px;
        border-radius:26px;
    }

    .product-image img{
        max-width:280px;
        max-height:280px;
    }

    .buttons{
        flex-direction:column;
    }

    .back-btn,
    .buttons form,
    .buttons button{
        width:100%;
    }
}

/* SMALL MOBILE */
@media(max-width:380px){
    .navbar{
        padding:14px 12px;
    }

    .logo{
        font-size:20px;
    }

    .product-card{
        padding:20px 14px;
        border-radius:22px;
    }

    .product-image img{
        max-width:230px;
        max-height:240px;
    }

    .product-details p{
        font-size:14px;
    }

    .btn{
        padding:12px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🛒 SmartCart</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="/user-dashboard">Dashboard</a>
        <a href="/user/products" class="active">Products</a>
        <a href="/user/cart">Cart</a>
        <a href="/user-logout">Logout</a>
    </div>
</div>

<div class="product-wrapper">

    <div class="product-card">

        <div class="product-layout">

            <div class="product-image">
                <img src="/static/uploads/product_images/{{ product.image }}" alt="{{ product.name }}">
            </div>

            <div class="product-details">

                <h2>{{ product.name }}</h2>

                <p><strong>Description:</strong> {{ product.description or "No description available" }}</p>
                <p><strong>Category:</strong> {{ product.category }}</p>

                <p class="price">₹{{ product.price }}</p>

                <div class="buttons">

                    <a href="/user/products" class="btn back-btn">Back</a>

                    <form action="/user/add-to-cart/{{ product.product_id }}" method="POST">
                        <button type="submit" class="btn cart-btn">Add to Cart</button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="footer">
    © 2026 SmartCart | All rights reserved 🚀
</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("show");
}
</script>

</body>
</html>
