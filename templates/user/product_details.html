<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - SmartCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    color:#fff;
}

/* NAVBAR */
.navbar{
    background:#050805;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
    font-size:22px;
    font-weight:800;
}

.nav-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:8px 14px;
    border-radius:20px;
    font-size:14px;
    font-weight:700;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

/* WRAPPER */
.product-wrapper{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 20px;
}

/* CARD */
.product-card{
    width:100%;
    max-width:900px;
    padding:30px;
    border-radius:30px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
}

.product-card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(211,255,65,.25) 1px, transparent 1px);
    background-size:9px 9px;
    opacity:.08;
    pointer-events:none;
}

.product-card > *{
    position:relative;
    z-index:2;
}

/* FLEX */
.product-layout{
    display:flex;
    gap:30px;
    align-items:center;
}

/* IMAGE */
.product-image{
    flex:1;
    text-align:center;
}

.product-image img{
    width:100%;
    max-width:300px;
    object-fit:contain;
    border-radius:20px;
    padding:12px;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(223,255,69,.35);
    box-shadow:0 0 22px rgba(223,255,69,.25);
}

/* DETAILS */
.product-details{
    flex:1;
}

.product-details h2{
    margin-bottom:12px;
    color:#dfff45;
    font-size:28px;
    font-weight:800;
}

.product-details p{
    margin:10px 0;
    color:#ddd;
    font-size:14px;
    line-height:1.6;
}

.product-details strong{
    color:#fff;
}

/* PRICE */
.price{
    font-size:28px !important;
    font-weight:800;
    color:#dfff45 !important;
    margin-top:14px !important;
}

/* BUTTONS */
.buttons{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 18px;
    border:none;
    border-radius:25px;
    font-size:14px;
    cursor:pointer;
    text-decoration:none;
    font-weight:800;
    display:inline-block;
}

/* COLORS */
.back-btn{
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
}

.back-btn:hover{
    background:#dfff45;
    color:#111;
}

.cart-btn{
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
}

.cart-btn:hover{
    box-shadow:0 0 20px rgba(211,255,65,.5);
}

/* FOOTER */
.footer{
    background:#050805;
    color:#aaa;
    text-align:center;
    padding:14px;
    font-size:13px;
}

/* RESPONSIVE */
@media(max-width:768px){
    .navbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .nav-links{
        width:100%;
    }

    .nav-links a{
        width:100%;
        text-align:center;
    }

    .product-layout{
        flex-direction:column;
        text-align:center;
    }

    .buttons{
        justify-content:center;
        flex-direction:column;
    }

    .btn,
    .buttons form,
    .buttons button{
        width:100%;
    }

    .product-card{
        padding:24px 20px;
        border-radius:26px;
    }

    .product-details h2{
        font-size:24px;
    }
}
</style>

</head>

<body>

<div class="navbar">
    <div class="logo">🛒 SmartCart</div>

    <div class="nav-links">
        <a href="/user-dashboard">Dashboard</a>
        <a href="/user/products">Products</a>
        <a href="/user/cart">Cart</a>
        <a href="/user-logout">Logout</a>
    </div>
</div>

<div class="product-wrapper">

    <div class="product-card">

        <div class="product-layout">

            <div class="product-image">
                <img src="/static/uploads/product_images/{{ product.image }}" alt="{{ product.name }}">
            </div>

            <div class="product-details">

                <h2>{{ product.name }}</h2>

                <p><strong>Description:</strong> {{ product.description or "No description available" }}</p>
                <p><strong>Category:</strong> {{ product.category }}</p>

                <p class="price">₹{{ product.price }}</p>

                <div class="buttons">

                    <a href="/user/products" class="btn back-btn">Back</a>

                    <form action="/user/add-to-cart/{{ product.product_id }}" method="POST">
                        <button type="submit" class="btn cart-btn">Add to Cart</button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="footer">
    © 2026 SmartCart | All rights reserved 🚀
</div>

</body>
</html>
