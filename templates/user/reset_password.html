<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - SmartCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:460px;
    padding:25px;
    border-radius:24px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    color:#fff;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    box-shadow:0 0 20px rgba(211,255,65,.35);
}

.logo h1{
    font-size:34px;
    font-weight:900;
    color:#fff;
}

.logo h1 span{
    color:#dfff45;
}

.logo p{
    margin-top:8px;
    color:#ccc;
}

.heading{
    text-align:center;
    margin-bottom:18px;
}

.heading h2{
    font-size:26px;
    margin-bottom:6px;
    color:#fff;
}

.heading p{
    color:#ccc;
}

.flash-msg{
    margin-bottom:16px;
}

.flash-msg p{
    background:rgba(223,255,69,.12);
    color:#dfff45;
    border:1px solid rgba(223,255,69,.25);
    padding:12px;
    border-radius:12px;
    font-weight:700;
    text-align:center;
    margin-bottom:10px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:800;
    color:#dfff45;
}

input{
    width:100%;
    padding:13px;
    border:2px solid rgba(255,255,255,.12);
    border-radius:12px;
    font-size:15px;
    background:rgba(255,255,255,.08);
    color:#fff;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    outline:none;
    border-color:#dfff45;
    box-shadow:0 0 12px rgba(223,255,69,.25);
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:25px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 20px rgba(211,255,65,.5);
}

.extra-links{
    margin-top:18px;
    text-align:center;
}

.extra-links a{
    color:#dfff45;
    text-decoration:none;
    font-weight:800;
}

.extra-links a:hover{
    text-decoration:underline;
}

@media(max-width:768px){
    .container{
        max-width:420px;
        padding:22px;
    }

    .logo h1{
        font-size:30px;
    }

    .heading h2{
        font-size:24px;
    }
}

@media(max-width:480px){
    body{
        padding:10px;
    }

    .container{
        width:100%;
        border-radius:18px;
        padding:20px;
    }

    .logo h1{
        font-size:26px;
    }

    .heading h2{
        font-size:22px;
    }

    input{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-row">
            <div class="logo-icon">🛍️</div>
            <h1>Smart<span>Cart</span></h1>
        </div>
        <p>Your Smart Shopping Partner</p>
    </div>

    <div class="heading">
        <h2>Reset Password</h2>
        <p>Create a new password</p>
    </div>

    <div class="flash-msg">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <form method="POST">

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" placeholder="Enter new password" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm password" required>
        </div>

        <button type="submit">Reset Password</button>

    </form>

    <div class="extra-links">
        <a href="{{ url_for('user_login') }}">Back to Login</a>
    </div>

</div>

</body>
</html>
