<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login - SmartCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ecf4c9,#cbd8b6);
    display:flex;
    flex-direction:column;
    color:#fff;
}

/* NAVBAR */
.navbar{
    width:100%;
    background:#050805;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:1000;
}

.nav-logo{
    font-size:24px;
    font-weight:900;
    color:#dfff45;
}

.menu-toggle{
    display:none;
    font-size:30px;
    color:#dfff45;
    cursor:pointer;
    user-select:none;
}

.nav-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:#ccc;
    padding:9px 15px;
    border-radius:20px;
    font-weight:800;
    font-size:14px;
    transition:.3s ease;
}

.nav-links a:hover{
    background:#dfff45;
    color:#111;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

/* LOGIN CARD */
.container{
    width:100%;
    max-width:470px;
    padding:26px;
    border-radius:26px;
    background:
      radial-gradient(circle at top, rgba(223,255,69,.15), transparent 40%),
      linear-gradient(180deg,#081300,#020302);
    box-shadow:0 25px 55px rgba(0,0,0,.45);
}

/* LOGO */
.logo{
    text-align:center;
    margin-bottom:22px;
}

.logo-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.logo-icon{
    width:60px;
    height:60px;
    min-width:60px;
    border-radius:50%;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    box-shadow:0 0 20px rgba(211,255,65,.35);
}

.logo h1{
    font-size:clamp(27px,8vw,34px);
    font-weight:900;
    color:#fff;
}

.logo h1 span{
    color:#dfff45;
}

.logo p{
    margin-top:8px;
    color:#ccc;
    font-size:15px;
}

/* TEXT */
.heading{
    text-align:center;
    margin-bottom:20px;
}

.heading h2{
    font-size:clamp(22px,6vw,27px);
    margin-bottom:7px;
    color:#dfff45;
}

.heading p{
    color:#ccc;
    font-size:15px;
}

/* FORM */
.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:800;
    color:#dfff45;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border:2px solid rgba(255,255,255,.12);
    border-radius:13px;
    font-size:15px;
    background:rgba(255,255,255,.08);
    color:#fff;
    outline:none;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    border-color:#dfff45;
    box-shadow:0 0 12px rgba(223,255,69,.25);
}

/* BUTTON */
button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:25px;
    background:linear-gradient(90deg,#e6ff45,#c9ff22);
    color:#111;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.3s ease;
}

button:hover{
    box-shadow:0 0 20px rgba(211,255,65,.5);
}

/* LINKS */
.extra-links{
    margin-top:18px;
    text-align:center;
}

.extra-links p{
    margin-bottom:8px;
    color:#ccc;
    font-size:14px;
}

.extra-links a{
    color:#dfff45;
    text-decoration:none;
    font-weight:800;
}

.extra-links a:hover{
    text-decoration:underline;
}

/* MOBILE MENU */
@media(max-width:768px){
    .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        width:100%;
        flex-direction:column;
        background:rgba(255,255,255,.08);
        padding:12px;
        border-radius:18px;
        margin-top:8px;
        border:1px solid rgba(223,255,69,.15);
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        background:rgba(255,255,255,.06);
    }

    .main{
        align-items:flex-start;
        padding:22px 12px;
    }
}

/* MOBILE */
@media(max-width:480px){
    .navbar{
        padding:14px 12px;
    }

    .nav-logo{
        font-size:22px;
    }

    .container{
        border-radius:22px;
        padding:22px 18px;
    }

    .logo-icon{
        width:54px;
        height:54px;
        min-width:54px;
        font-size:25px;
    }

    input{
        font-size:14px;
        padding:12px;
    }

    button{
        font-size:15px;
        padding:13px;
    }
}

/* SMALL MOBILE */
@media(max-width:360px){
    .container{
        padding:20px 15px;
    }

    .nav-logo{
        font-size:20px;
    }

    .logo p,
    .heading p,
    .extra-links p{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="nav-logo">SmartCart</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/user-register">Register</a>
    </div>
</div>

<div class="main">

<div class="container">

    <div class="logo">
        <div class="logo-row">
            <div class="logo-icon">🛍️</div>
            <h1>Smart<span>Cart</span></h1>
        </div>
        <p>Your Smart Shopping Partner</p>
    </div>

    <div class="heading">
        <h2>User Login</h2>
        <p>Login to shop with SmartCart</p>
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="extra-links">
        <p>Do not have account? <a href="/user-register">Register</a></p>
        <a href="/user/forgot-password">Forgot Password?</a>
    </div>

</div>

</div>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("show");
}
</script>

</body>
</html>
